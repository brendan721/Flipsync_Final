# FlipSync Production - Enhanced WebSocket Configuration
# Standardizes on www.flipsyncai.com with proper WebSocket support

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name flipsyncai.com www.flipsyncai.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    location / {
        return 301 https://www.flipsyncai.com$request_uri;
    }
}

# HTTPS Redirect - flipsyncai.com to www.flipsyncai.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flipsyncai.com;

    ssl_certificate /etc/letsencrypt/live/flipsyncai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flipsyncai.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/flipsyncai.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    return 301 https://www.flipsyncai.com$request_uri;
}

# Main HTTPS Server - www.flipsyncai.com ONLY
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.flipsyncai.com;

    root /var/www/flipsyncai.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/flipsyncai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flipsyncai.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/flipsyncai.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Enhanced WebSocket Support with HTTP/1.1 enforcement
    location /ws/ {
        # Force HTTP/1.1 for WebSocket connections (HTTP/2 doesn't support WebSocket upgrades)
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Essential WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket specific timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Disable buffering for WebSocket
        proxy_buffering off;
        proxy_cache off;

        # Disable HTTP/2 for WebSocket endpoints
        http2_push off;
    }

    # API Routes - NO CORS HEADERS (FastAPI handles CORS)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health Check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # Static Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Flutter Service Worker
    location = /flutter_service_worker.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # eBay OAuth Callback
    location = /ebay-oauth {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Flutter SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security
    location ~ /\. { deny all; access_log off; }
    location ~ \.(env|log|conf)$ { deny all; access_log off; }
}
