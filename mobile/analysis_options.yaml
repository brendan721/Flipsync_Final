# FlipSync Production Analysis Options
# Balanced linting configuration for production deployment
# Focus on critical errors while allowing build to succeed

include: package:flutter_lints/flutter.yaml

analyzer:
  # Exclude generated files and build directories
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "**/generated_plugin_registrant.dart"
    - "build/**"
    - "lib/generated/**"
    - "lib/gen/**"
    - "android/**"
    - "ios/**"
    - "web/**"
    - ".dart_tool/**"

  # Error handling - focus on critical issues only
  errors:
    # Critical errors that must be fixed
    invalid_assignment: error
    missing_required_param: error
    missing_return: error
    # Downgrade style issues to warnings/info to allow builds
    dead_code: warning
    unused_import: info
    unused_local_variable: info
    # Downgrade all style-related issues to info
    directives_ordering: info
    prefer_expression_function_bodies: info
    sort_constructors_first: info
    prefer_const_constructors: info
    avoid_redundant_argument_values: info
    always_put_control_body_on_new_line: info
    always_put_required_named_parameters_first: info
    avoid_catches_without_on_clauses: info
    parameter_assignments: info
    omit_local_variable_types: info
    unnecessary_lambdas: info
    unnecessary_await_in_return: info
    cascade_invocations: info
    prefer_relative_imports: info
    avoid_print: info
    unreachable_from_main: info

linter:
  rules:
    # === CRITICAL ERROR PREVENTION ===
    # Only enable rules that prevent actual bugs/errors
    avoid_empty_else: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    control_flow_in_finally: true
    empty_catches: true
    hash_and_equals: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    no_duplicate_case_values: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    unrelated_type_equality_checks: true
    use_build_context_synchronously: true
    valid_regexps: true

    # === SECURITY RULES ===
    # Security best practices
    avoid_web_libraries_in_flutter: true
    secure_pubspec_urls: true

    # === FLUTTER SPECIFIC ===
    # Essential Flutter best practices only
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true

    # === PERFORMANCE (CRITICAL ONLY) ===
    # Only performance rules that prevent real issues
    avoid_slow_async_io: true
    prefer_collection_literals: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
