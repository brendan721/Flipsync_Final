<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipSync Agent Monitoring Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .summary-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }
        .summary-card .value {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .agent-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease;
        }
        .agent-card:hover {
            transform: translateY(-5px);
        }
        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .agent-name {
            font-size: 1.3em;
            font-weight: bold;
        }
        .agent-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-healthy { background: #4CAF50; }
        .status-warning { background: #FF9800; }
        .status-critical { background: #F44336; }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .metric:last-child {
            border-bottom: none;
        }
        .metric-label {
            font-weight: 500;
        }
        .metric-value {
            font-weight: bold;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        .btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 10px;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        .connected { background: #4CAF50; }
        .disconnected { background: #F44336; }
        .last-update {
            text-align: center;
            margin-top: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🤖 FlipSync Agent Monitoring Dashboard</h1>
            <p>Real-time monitoring of 4+1 Architecture autonomous agents</p>
        </div>

        <div class="connection-status" id="connectionStatus">
            🔴 Disconnected
        </div>

        <div class="controls">
            <button class="btn" onclick="startMonitoring()">Start Monitoring</button>
            <button class="btn" onclick="stopMonitoring()">Stop Monitoring</button>
            <button class="btn" onclick="refreshData()">Refresh Data</button>
        </div>

        <div class="summary" id="summary">
            <div class="summary-card">
                <h3>Total Agents</h3>
                <div class="value" id="totalAgents">-</div>
            </div>
            <div class="summary-card">
                <h3>Healthy Agents</h3>
                <div class="value" id="healthyAgents">-</div>
            </div>
            <div class="summary-card">
                <h3>Average Decision Time</h3>
                <div class="value" id="avgDecisionTime">-</div>
            </div>
            <div class="summary-card">
                <h3>Overall Success Rate</h3>
                <div class="value" id="successRate">-</div>
            </div>
        </div>

        <div class="agents-grid" id="agentsGrid">
            <!-- Agent cards will be populated here -->
        </div>

        <div class="last-update" id="lastUpdate">
            Last updated: Never
        </div>
    </div>

    <script>
        let websocket = null;
        let isConnected = false;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            refreshData();
            connectWebSocket();
        });

        async function startMonitoring() {
            try {
                const response = await fetch('/api/v1/agent-monitoring/start', {
                    method: 'POST'
                });
                const result = await response.json();
                console.log('Monitoring started:', result);
                setTimeout(refreshData, 2000); // Refresh after 2 seconds
            } catch (error) {
                console.error('Error starting monitoring:', error);
            }
        }

        async function stopMonitoring() {
            try {
                const response = await fetch('/api/v1/agent-monitoring/stop', {
                    method: 'POST'
                });
                const result = await response.json();
                console.log('Monitoring stopped:', result);
            } catch (error) {
                console.error('Error stopping monitoring:', error);
            }
        }

        async function refreshData() {
            try {
                const response = await fetch('/api/v1/agent-monitoring/metrics');
                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/api/v1/agent-monitoring/ws`;
            
            websocket = new WebSocket(wsUrl);
            
            websocket.onopen = function() {
                isConnected = true;
                updateConnectionStatus();
                console.log('WebSocket connected');
            };
            
            websocket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                updateDashboard(data);
            };
            
            websocket.onclose = function() {
                isConnected = false;
                updateConnectionStatus();
                console.log('WebSocket disconnected');
                // Reconnect after 5 seconds
                setTimeout(connectWebSocket, 5000);
            };
            
            websocket.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }

        function updateConnectionStatus() {
            const statusElement = document.getElementById('connectionStatus');
            if (isConnected) {
                statusElement.textContent = '🟢 Connected';
                statusElement.className = 'connection-status connected';
            } else {
                statusElement.textContent = '🔴 Disconnected';
                statusElement.className = 'connection-status disconnected';
            }
        }

        function updateDashboard(data) {
            // Update summary
            document.getElementById('totalAgents').textContent = data.summary.total_agents;
            document.getElementById('healthyAgents').textContent = data.summary.healthy_agents;
            document.getElementById('avgDecisionTime').textContent = 
                Math.round(data.summary.average_decision_time) + 'ms';
            
            // Calculate overall success rate
            const totalSuccessRate = data.agents.reduce((sum, agent) => sum + agent.success_rate, 0) / data.agents.length;
            document.getElementById('successRate').textContent = 
                Math.round(totalSuccessRate * 100) + '%';

            // Update agents grid
            const agentsGrid = document.getElementById('agentsGrid');
            agentsGrid.innerHTML = '';

            data.agents.forEach(agent => {
                const agentCard = createAgentCard(agent);
                agentsGrid.appendChild(agentCard);
            });

            // Update last update time
            document.getElementById('lastUpdate').textContent = 
                `Last updated: ${new Date(data.timestamp).toLocaleTimeString()}`;
        }

        function createAgentCard(agent) {
            const card = document.createElement('div');
            card.className = 'agent-card';
            
            const healthStatusClass = `status-${agent.health_status}`;
            const agentTypeTitle = agent.agent_type.charAt(0).toUpperCase() + agent.agent_type.slice(1);
            
            card.innerHTML = `
                <div class="agent-header">
                    <div class="agent-name">${agentTypeTitle} Agent</div>
                    <div class="agent-status ${healthStatusClass}">${agent.health_status.toUpperCase()}</div>
                </div>
                <div class="metric">
                    <span class="metric-label">Status:</span>
                    <span class="metric-value">${agent.status}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Decision Time:</span>
                    <span class="metric-value">${Math.round(agent.last_decision_time_ms)}ms</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Success Rate:</span>
                    <span class="metric-value">${Math.round(agent.success_rate * 100)}%</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Confidence:</span>
                    <span class="metric-value">${Math.round(agent.confidence_score * 100)}%</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Decisions Made:</span>
                    <span class="metric-value">${agent.decisions_made}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Last Activity:</span>
                    <span class="metric-value">${new Date(agent.last_activity).toLocaleTimeString()}</span>
                </div>
            `;
            
            return card;
        }

        // Auto-refresh every 30 seconds if not connected via WebSocket
        setInterval(() => {
            if (!isConnected) {
                refreshData();
            }
        }, 30000);
    </script>
</body>
</html>
