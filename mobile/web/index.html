<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FlipSync - Your Intelligent Business Partner for E-commerce">

  <!-- Content Security Policy for HTTPS production -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://www.gstatic.com https://fonts.gstatic.com https://fonts.googleapis.com; connect-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://fonts.gstatic.com wss://flipsyncai.com https://flipsyncai.com https://auth.ebay.com https://api.ebay.com ws://localhost:* http://localhost:* https://localhost:*; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:;">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flipsync">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flipsync</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- eBay OAuth Popup Handler -->
  <script>
    console.log('🚀 FlipSync OAuth handler initialized');

    // Flag to prevent multiple processing of the same OAuth result
    let oauthProcessed = false;
    let processedOAuthId = null;

    // Method 1: Listen for OAuth callback messages from popup windows (postMessage)
    window.addEventListener('message', function(event) {
      // Verify the message source
      if (event.data && event.data.source === 'ebay_oauth_callback') {
        console.log('📨 eBay OAuth callback received via postMessage:', event.data);
        processOAuthResult(event.data);
      }
    });

    // Method 2: Listen for BroadcastChannel messages
    if (typeof BroadcastChannel !== 'undefined') {
      const oauthChannel = new BroadcastChannel('flipsync_oauth');
      oauthChannel.addEventListener('message', function(event) {
        console.log('📨 eBay OAuth callback received via BroadcastChannel:', event.data);
        if (event.data && event.data.source === 'ebay_oauth_callback') {
          processOAuthResult(event.data);
        }
      });
      console.log('✅ BroadcastChannel listener setup complete');
    } else {
      console.log('❌ BroadcastChannel not supported');
    }

    // Method 3: Listen for localStorage changes
    window.addEventListener('storage', function(event) {
      if (event.key === 'flipsync_oauth_result' && event.newValue) {
        try {
          const data = JSON.parse(event.newValue);
          console.log('📨 eBay OAuth callback received via localStorage:', data);
          if (data && data.source === 'ebay_oauth_callback') {
            processOAuthResult(data);
            // Clean up localStorage after processing
            localStorage.removeItem('flipsync_oauth_result');
          }
        } catch (error) {
          console.log('❌ Error parsing localStorage OAuth data:', error);
        }
      }
    });

    // Method 4: Poll localStorage for immediate detection (fallback)
    let storageCheckInterval = setInterval(function() {
      const storedResult = localStorage.getItem('flipsync_oauth_result');
      if (storedResult) {
        try {
          const data = JSON.parse(storedResult);
          if (data && data.source === 'ebay_oauth_callback') {
            console.log('📨 eBay OAuth callback detected via localStorage polling:', data);
            processOAuthResult(data);
            localStorage.removeItem('flipsync_oauth_result');
            clearInterval(storageCheckInterval);
          }
        } catch (error) {
          console.log('❌ Error parsing polled localStorage OAuth data:', error);
        }
      }
    }, 1000);

    // Stop polling after 5 minutes
    setTimeout(() => {
      clearInterval(storageCheckInterval);
      console.log('🔄 OAuth localStorage polling stopped');
    }, 300000);

    function processOAuthResult(data) {
      console.log('🔄 Processing OAuth result:', data);

      // Create a unique ID for this OAuth result to prevent duplicate processing
      const oauthId = data.state + '_' + (data.code || 'no_code');

      // Check if we've already processed this OAuth result
      if (oauthProcessed && processedOAuthId === oauthId) {
        console.log('⚠️ OAuth result already processed, skipping duplicate');
        return;
      }

      // Mark as processed
      oauthProcessed = true;
      processedOAuthId = oauthId;
      console.log('✅ Processing OAuth result (first time)');

      if (data.success === true && data.code && data.state) {
        // Handle successful OAuth with code and state
        console.log('✅ eBay OAuth successful with code and state');
        handleEbayOAuthSuccess(data.code, data.state);
      } else if (data.code === "oauth_processed_successfully" || (data.success && data.message)) {
        // Handle server-processed OAuth (tokens already stored by backend)
        console.log('✅ eBay OAuth successful (server-side processed)');
        handleEbayOAuthServerProcessed(data);
      } else if (data.code && data.state && data.code !== "oauth_processed_successfully") {
        // Handle raw OAuth code that needs processing
        console.log('✅ eBay OAuth successful, processing raw code...');
        handleEbayOAuthSuccess(data.code, data.state);
      } else if (data.error || data.success === false) {
        // Handle OAuth error
        console.log('❌ eBay OAuth error:', data.error || 'OAuth failed');
        handleEbayOAuthError(data.error || data.error_description || 'OAuth failed');
      } else {
        // Handle unexpected data format
        console.log('⚠️ Unexpected OAuth result format:', data);
        handleEbayOAuthError('Unexpected authentication result format');
      }
    }

    function handleEbayOAuthServerProcessed(data) {
      try {
        console.log('✅ eBay OAuth already processed by server:', data);

        // Notify Flutter app about successful connection
        if (window.flutter_oauth_callback) {
          window.flutter_oauth_callback('ebay', true, data.message || 'eBay connected successfully');
        }

        // Show success notification
        console.log('🎉 eBay marketplace connected successfully!');

        // Don't reload the page - let Flutter handle the state update
        console.log('✅ OAuth success handled - Flutter will update connection status');

      } catch (error) {
        console.error('❌ Error handling server-processed OAuth:', error);
        handleEbayOAuthError(`Processing error: ${error.message}`);
      }
    }

    async function handleEbayOAuthSuccess(code, state) {
      try {
        console.log('✅ eBay OAuth successful, exchanging code for tokens...');

        // Get access token from Flutter app (it uses secure storage, not localStorage)
        let accessToken = '';
        try {
          // Try to get token from Flutter app if available
          if (window.flutter_auth_token) {
            accessToken = window.flutter_auth_token;
            console.log('🔑 Using access token from Flutter app');
          } else {
            // Fallback to localStorage (might be empty)
            accessToken = localStorage.getItem('access_token') || '';
            console.log('⚠️ Using access token from localStorage (might be empty)');
          }
        } catch (e) {
          console.log('❌ Error getting access token:', e);
        }

        // OAuth processing is already complete from the GET callback
        // No need for additional POST request - tokens are already exchanged and stored
        console.log('✅ eBay OAuth completed via GET callback - no additional token exchange needed');

        // Notify Flutter app about successful connection
        if (window.flutter_oauth_callback) {
          window.flutter_oauth_callback('ebay', true, 'eBay connected successfully');
        }

        // Show success message
        console.log('🎉 eBay marketplace connected successfully!');

        // Don't reload the page - let Flutter handle the state update
        console.log('✅ OAuth success handled - Flutter will update connection status');

      } catch (error) {
        console.error('❌ eBay OAuth processing error:', error);
        handleEbayOAuthError(`Processing error: ${error.message}`);
      }
    }

    function handleEbayOAuthError(error) {
      console.error('❌ eBay OAuth error:', error);
      // Notify Flutter app about error
      if (window.flutter_oauth_callback) {
        window.flutter_oauth_callback('ebay', false, error);
      }
      alert(`eBay connection failed: ${error}`);
    }

    // Define the flutter_oauth_callback function that's referenced throughout the code
    window.flutter_oauth_callback = function(marketplace, success, message) {
      console.log(`🔄 Flutter OAuth callback: ${marketplace}, success: ${success}, message: ${message}`);

      if (success) {
        console.log(`✅ ${marketplace} OAuth successful via flutter_oauth_callback`);
        // The OAuth is already complete, just show success message
        // No need to make additional API calls since backend already processed everything
      } else {
        console.log(`❌ ${marketplace} OAuth failed via flutter_oauth_callback: ${message}`);
      }

      // Note: We don't need to do anything special here since the marketplace connection screen
      // will refresh its status automatically after the OAuth popup closes
    };

    // Make functions available globally for Flutter to call
    window.ebay_oauth_handler = {
      handleSuccess: handleEbayOAuthSuccess,
      handleError: handleEbayOAuthError
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
