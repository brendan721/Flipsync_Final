# FlipSync Server Block Configuration for www.flipsyncai.com
# Following DigitalOcean best practices for nginx server blocks
# Enhanced with performance optimizations

# Performance Configuration
proxy_cache_path /var/cache/nginx/flipsync levels=1:2 keys_zone=flipsync_cache:10m max_size=1g inactive=60m use_temp_path=off;
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=500m inactive=30m use_temp_path=off;

# Rate Limiting Configuration
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;

# Connection Limiting
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name www.flipsyncai.com flipsyncai.com;
    
    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect all HTTP to HTTPS (standardize on www)
    location / {
        return 301 https://www.flipsyncai.com$request_uri;
    }
}

# HTTPS Redirect - flipsyncai.com to www.flipsyncai.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flipsyncai.com;

    # SSL Configuration using Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/flipsyncai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flipsyncai.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/flipsyncai.com/chain.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Redirect non-www to www
    return 301 https://www.flipsyncai.com$request_uri;
}

# Main HTTPS Server - www.flipsyncai.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.flipsyncai.com;

    # Document root for Flutter web app
    root /var/www/flipsyncai.com;
    index index.html index.htm;

    # Performance Settings
    limit_req zone=general_limit burst=20 nodelay;
    limit_conn conn_limit_per_ip 10;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # SSL Configuration using Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/flipsyncai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flipsyncai.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/flipsyncai.com/chain.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client settings
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Static Asset Caching with Performance Optimization
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        limit_req zone=static_limit burst=50 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status "STATIC";

        # Compression for static assets
        gzip_static on;

        # Security headers for static assets
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # Flutter Service Worker (No Cache)
    location = /flutter_service_worker.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Cache-Status "NO-CACHE";
    }

    # Flutter Manifest
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Cache-Status "SHORT-CACHE";
    }

    # API Routes - Proxy to Docker container with Performance Optimization
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # API Response Caching (selective)
        proxy_cache api_cache;
        proxy_cache_valid 200 302 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Cache headers
        add_header X-Cache-Status $upstream_cache_status;

        # Optimized Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # CORS is handled by FastAPI backend - no nginx-level CORS headers needed
        # This prevents double CORS processing and conflicts
    }

    # Authentication Routes
    location ~ ^/api/(auth|login|register|oauth) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket Support
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # eBay OAuth Callback - Critical for eBay integration
    location /ebay-oauth {
        proxy_pass http://127.0.0.1:8000/ebay-oauth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Health Check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Flutter Web App - Single Page Application (SPA) routing
    location / {
        # Try to serve request as file, then as directory, then fall back to index.html
        # This is essential for Flutter web routing to work properly
        try_files $uri $uri/ /index.html;

        # Add headers for Flutter web app
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Cache static assets (Flutter compiled files)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;

            # Enable gzip compression for Flutter assets
            gzip on;
            gzip_vary on;
            gzip_min_length 1024;
            gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/wasm;
        }

        # Cache HTML files for shorter period (Flutter may update these)
        location ~* \.(html|htm)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";

            # Ensure proper MIME type for HTML
            add_header Content-Type "text/html; charset=utf-8";
        }

        # Handle Flutter service worker
        location = /flutter_service_worker.js {
            expires 0;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Handle Flutter manifest
        location = /manifest.json {
            expires 1d;
            add_header Cache-Control "public, must-revalidate";
            add_header Content-Type "application/json; charset=utf-8";
        }
    }

    # Security: Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(env|log|conf|sql|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}


